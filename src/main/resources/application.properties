spring.application.name=job-data-api

# The static dataset, read once at startup. Point at file:/... to swap in a different survey.
jobdata.source=classpath:data/salary_survey-3.json

# meta.total_pages matches the snake_case field names used in data rows
spring.jackson.property-naming-strategy=SNAKE_CASE

springdoc.swagger-ui.path=/swagger-ui.html
